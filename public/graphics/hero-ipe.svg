<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" width="720" height="620" role="presentation" aria-hidden="true" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="g1" cx="62%" cy="26%" r="72%">
      <stop offset="0%"  stop-color="#FDF3DC"/>
      <stop offset="60%" stop-color="#FAF6EF"/>
      <stop offset="100%" stop-color="#F2EEE4"/>
    </radialGradient>
    <linearGradient id="g2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"  stop-color="#0B4F3F"/>
      <stop offset="100%" stop-color="#12715A"/>
    </linearGradient>
  </defs>
  <rect width="720" height="620" fill="url(#g1)"/>
  <!-- abstract ipe canopy: warm blossom clusters, no literal tree -->
  <g opacity="0.9">
    <circle cx="560" cy="120" r="86" fill="#E8A317" opacity="0.16"/>
    <circle cx="636" cy="188" r="58" fill="#E8A317" opacity="0.22"/>
    <circle cx="492" cy="196" r="46" fill="#E8A317" opacity="0.13"/>
    <circle cx="600" cy="76"  r="34" fill="#E8A317" opacity="0.28"/>
  </g>
  <!-- restrained skyline band: modern mid-rise silhouette -->
  <g fill="url(#g2)" opacity="0.13">
    <rect x="420" y="392" width="54" height="228" rx="4"/>
    <rect x="486" y="440" width="42" height="180" rx="4"/>
    <rect x="540" y="356" width="62" height="264" rx="4"/>
    <rect x="614" y="424" width="46" height="196" rx="4"/>
    <rect x="672" y="470" width="48" height="150" rx="4"/>
  </g>
  <g fill="#12715A" opacity="0.10">
    <rect x="0"   y="470" width="58" height="150" rx="4"/>
    <rect x="70"  y="506" width="44" height="114" rx="4"/>
  </g>
  <!-- soft ground wash so overlaid UI stays legible -->
  <rect y="470" width="720" height="150" fill="#FAF6EF" opacity="0.55"/>
</svg>
